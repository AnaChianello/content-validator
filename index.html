<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Validador BIP</title>

  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Work Sans", sans-serif;
      background: #F5F7FA;
      color: #0C2340;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 32px;
      border-radius: 6px;
      border: 1px solid #DADEE2;
      width: 320px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: 1px solid #DADEE2;
    }

    button {
      margin-top: 16px;
      padding: 10px;
      width: 100%;
      background: #DA291C;
      color: white;
      border: none;
      cursor: pointer;
    }

    #app {
      display: none;
      padding: 24px;
    }

    textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="box">
    <h3>Acesso restrito</h3>
    <p>Digite a senha</p>

    <input type="password" id="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>

    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <h2>Validador de conteúdo</h2>

  <label>Legenda</label>
  <textarea id="caption"></textarea>

  <label>Texto da arte</label>
  <textarea id="artwork"></textarea>

  <br><br>

  <button onclick="validate()">Validar</button>

  <pre id="result"></pre>
</div>

<script>
  const PASSWORD = "bip2026"; // 🔑 ALTERE AQUI

  function login() {
    const input = document.getElementById("password").value;

    if (input === PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      document.getElementById("error").innerText = "Senha incorreta";
    }
  }

  async function validate() {
    const caption = document.getElementById("caption").value;
    const artworkText = document.getElementById("artwork").value;

    const res = await fetch("/validate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ caption, artworkText })
    });

    const data = await res.json();

    document.getElementById("result").innerText =
      JSON.stringify(data, null, 2);
  }
</script>

</body>
</html>
