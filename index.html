<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Conteúdo | BIP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bip-blue: #0C2340;
      --bip-red: #DA291C;
      --bip-white: #FFFFFF;

      --text-main: #0C2340;
      --text-soft: #546579;
      --border: #DADEE2;

      --bg-soft: #F5F7FA;
      --bg-card: #FFFFFF;

      --radius: 4px;
    }

    body {
      margin: 0;
      font-family: "Work Sans", Arial, sans-serif;
      background: var(--bg-soft);
      color: var(--text-main);
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    /* HERO */

    .hero {
      background: var(--bip-blue);
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-weight: 300;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
    }

    /* TAGS (CORRIGIDO) */

    .tags {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .tag {
      background: rgba(255,255,255,0.12);
      color: #FFFFFF;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* LAYOUT */

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card h2 {
      margin-top: 0;
      font-weight: 300;
    }

    /* INPUTS */

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--border);
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      border-radius: var(--radius);
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--bip-red);
      outline: none;
    }

    /* BUTTONS */

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 16px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .primary {
      background: var(--bip-red);
      color: white;
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--bip-blue);
    }

    .status {
      font-size: 13px;
      color: var(--text-soft);
    }

    /* RESULTADOS */

    .score {
      font-size: 40px;
      font-weight: 300;
    }

    .section {
      margin-top: 16px;
    }

    ul {
      padding-left: 18px;
      color: var(--text-soft);
    }

    .json {
      background: var(--bip-blue);
      color: #E6EDF5;
      padding: 12px;
      font-size: 12px;
      overflow: auto;
      max-height: 200px;
      border-radius: var(--radius);
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="hero">
      <h1>Validador de conteúdo</h1>
      <p>Avalie legenda e texto de arte com base em critérios estruturados.</p>

      <div class="tags">
        <div class="tag">Tom institucional</div>
        <div class="tag">Clareza</div>
        <div class="tag">Legenda + arte</div>
      </div>
    </div>

    <div class="layout">

      <div class="card">
        <h2>Entrada</h2>

        <label>Legenda</label>
        <textarea id="caption"></textarea>

        <label>Texto da arte</label>
        <textarea id="artwork"></textarea>

        <div class="actions">
          <button class="primary" id="validate">Validar</button>
          <button class="secondary" id="clear">Limpar</button>
          <div class="status" id="status">Aguardando</div>
        </div>
      </div>

      <div class="card">
        <h2>Resultado</h2>

        <div class="score" id="score">-</div>

        <div class="section">
          <strong>Positivos</strong>
          <ul id="positives"></ul>
        </div>

        <div class="section">
          <strong>Melhorias</strong>
          <ul id="improvements"></ul>
        </div>

        <div class="section">
          <strong>JSON</strong>
          <div class="json" id="json"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const caption = document.getElementById("caption");
    const artwork = document.getElementById("artwork");
    const status = document.getElementById("status");
    const score = document.getElementById("score");
    const positives = document.getElementById("positives");
    const improvements = document.getElementById("improvements");
    const json = document.getElementById("json");

    document.getElementById("clear").onclick = () => {
      caption.value = "";
      artwork.value = "";
      score.innerText = "-";
      positives.innerHTML = "";
      improvements.innerHTML = "";
      json.innerText = "";
      status.innerText = "Aguardando";
    };

    document.getElementById("validate").onclick = async () => {
      const payload = {
        caption: caption.value,
        artworkText: artwork.value
      };

      if (!payload.caption && !payload.artworkText) {
        status.innerText = "Preencha algum campo";
        return;
      }

      status.innerText = "Validando...";

      const res = await fetch("/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      json.innerText = JSON.stringify(data, null, 2);

      score.innerText = data.final_score || "-";

      positives.innerHTML = (data.pontos_positivos || [])
        .map(p => `<li>${p}</li>`)
        .join("");

      improvements.innerHTML = (data.pontos_melhoria || [])
        .map(p => `<li>${p}</li>`)
        .join("");

      status.innerText = "Concluído";
    };
  </script>
</body>
</html>
